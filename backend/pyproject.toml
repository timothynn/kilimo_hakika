[project]
name = "kilimo-hakika-backend"
version = "0.1.0"
description = "Deterministic depot triage API, identity, market and assistant services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pyjwt>=2.9",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kilimo_hakika"]

[tool.ruff]
line-length = 110
target-version = "py312"
# This config arrived with src/kilimo_hakika and governs only it. The other
# service under backend/ (app/, main.py, verify.py, scripts/build_data.py, and
# its tests) predates it and was written to different conventions; reformatting
# it to match would be a large diff over someone else's work and no improvement
# to it. Whoever owns that service decides its tooling. See
# docs/design/integration.md.
extend-exclude = [
    "app",
    "main.py",
    "verify.py",
    "scripts/build_data.py",
    "tests/test_api.py",
    "tests/test_data_quality.py",
    "tests/test_triage.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares query params as call defaults; that is the framework idiom.
"src/kilimo_hakika/api/routes/*.py" = ["B008"]
# Prose: the assistant's system prompt and the farmer-facing copy tables read
# worse hard-wrapped than they do long.
"src/kilimo_hakika/assistant/client.py" = ["E501"]
"src/kilimo_hakika/engine/evaluate.py" = ["E501"]
"src/kilimo_hakika/assistant/scopes.py" = ["E501"]
# An end-to-end assertion reads better on one line than wrapped across three.
"scripts/smoke_api.py" = ["E501"]

# pytest is configured in pytest.ini, which pytest reads in preference to this
# file. Keeping one copy avoids a config that looks right and is ignored.

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/kilimo_hakika/engine"]
