[pytest]
# Two Python services live under backend/ right now (see
# docs/design/integration.md), so both roots are on the path:
#   .    -> `main` and `app`, the way uvicorn imports them
#   src  -> `kilimo_hakika`, without an editable install
# This file takes precedence over [tool.pytest.ini_options] in pyproject.toml,
# so the settings for both suites have to live here or one is silently ignored.
pythonpath = . src
testpaths = tests
addopts = -q
filterwarnings =
    error::DeprecationWarning
